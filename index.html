    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', 'Inter', sans-serif;
            font-weight: 500;
        }
        .font-inter {
            font-family: 'Inter', sans-serif;
        }
        /* مظهر ورقة الدفتر المخططة لشاشة الكتابة */
        .notebook-paper {
            background-color: #fcfcfc;
            background-image: linear-gradient(#e1e1e1 1px, transparent 1px);
            background-size: 100% 2rem;
            line-height: 2rem;
        }
        /* شريط تمرير أفقي أنحف لصفوف الوحدات والقواعد */
        .thin-scroll::-webkit-scrollbar { height: 6px; }
        .thin-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        /* لوحة الرسم/التعليق بالقلم أو الإصبع */
        .draw-canvas { touch-action: none; cursor: crosshair; }
        /* لوحة الكتابة بالقلم: تسمح بالتمرير الأصلي السلس بالإصبع (بما فيها راحة اليد المرتاحة
           أثناء الكتابة بالقلم الرقمي)، بينما يُمنع التمرير فقط أثناء رسم فعلي بالقلم/الفأرة عبر
           preventDefault في كود JavaScript (Pointer Events) - هذا يحل مشكلتي التمرير غير السلس
           وظهور قائمة تحديد النص عند لمس راحة اليد بشكل جذري */
        .draw-canvas-pen { touch-action: pan-y; cursor: crosshair; }

        /* ============ إصلاح عام لوضوح حقول الإدخال بالوضع الليلي ============ */
        /* بعض المتصفحات (خصوصاً Safari/iPad) تفرض تنسيقاً داكناً تلقائياً على عناصر
           input/textarea/select عند تفعيل الوضع الليلي بالنظام، بغض النظر عن ألوان Tailwind،
           فيصير النص أبيض على خلفية بيضاء (غير مرئي). هذا يجبر المتصفح على العرض الفاتح دائماً
           لعناصر النموذج، ويُبقي تلوين التطبيق نفسه (dark:) كما هو دون تأثير. */
        input, textarea, select {
            color-scheme: light;
        }
        /* أي حقل إدخال لم يُخصَّص له لون صريح بالوضع الليلي يرث خلفية داكنة ونص فاتح واضح تلقائياً */
        .dark input:not([class*="dark:bg-"]),
        .dark textarea:not([class*="dark:bg-"]),
        .dark select:not([class*="dark:bg-"]) {
            background-color: #1e293b;
            color: #f1f5f9;
            border-color: #334155;
        }
        .dark input::placeholder,
        .dark textarea::placeholder {
            color: #94a3b8;
        }

        /* ============ إصلاح شامل لمشكلة "النص الأبيض على خلفية بيضاء" بالوضع الليلي ============ */
        /* عشرات النوافذ المنبثقة والبطاقات بالتطبيق تستخدم خلفية "bg-white" ثابتة (بدون نسخة
           dark: مقابلة)، بينما نص العنصر الأب (body) يتحول تلقائياً لأبيض تقريباً بالوضع الليلي
           (dark:text-slate-100). النتيجة: نص أبيض فوق خلفية بيضاء = غير مرئي تماماً.
           هذا الإصلاح يجعل أي عنصر "bg-white" لم يُخصَّص له لون داكن مقابل صراحة يتحول تلقائياً
           لخلفية داكنة ونص فاتح واضح بالوضع الليلي، دون التأثير على العناصر المصممة أصلاً للوضعين. */
        .dark .bg-white:not([class*="dark:bg-"]) {
            background-color: #1e293b;
            color: #f1f5f9;
        }
    </style>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#2563eb', // Blue - اللون السائد الجديد
                            600: '#1d4ed8',
                            700: '#1e40af',
                        },
                        secondary: {
                            50: '#f0fdfa',
                            500: '#14b8a6', // Teal (لون مساعد)
                            600: '#0d9488',
                        }
                    }
                }
            }
        }
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // ============ مزامنة سحابية مع Firestore ============
        // uid المستخدم الحالي (يُحدَّث من AuthGate عند تسجيل الدخول/الخروج)
        let cloudUid = null;
        let cloudSyncTimers = {};

        // كل مفتاح بيانات (reading_units_new، writing_topics...) يُزامن كمستند Firestore مستقل تحت
        // users/{uid}/data/{key} بدل مستند واحد ضخم لكل البيانات. هذا يمنع فشل مزامنة مفتاح واحد
        // من التأثير على بقية المفاتيح، ويظهر تنبيه صريح يسمي المفتاح المتعطل عند حدوث مشكلة.

        // ينظّف أي كائن من قيم undefined قبل إرساله لـ Firestore (Firestore يرمي خطأ متزامناً
        // غير قابل للالتقاط بـ.catch() العادية لو صادف حقل بقيمة undefined، مما كان يوقف كامل
        // عملية المزامنة بصمت تام بدون أي تنبيه للمستخدم)
        function sanitizeForFirestore(obj) {
            if (obj === undefined) return null;
            if (obj === null || typeof obj !== 'object') return obj;
            if (Array.isArray(obj)) return obj.map(sanitizeForFirestore);
            const clean = {};
            Object.keys(obj).forEach(k => {
                const v = obj[k];
                clean[k] = v === undefined ? null : sanitizeForFirestore(v);
            });
            return clean;
        }

        // ============ مزامنة دقيقة لقسم الصوتيات (Phonics) ============
        // نفس مبدأ بطاقات SRS تماماً: بيانات النص لكل حرف (خفيفة) بمستند مستقل، وكل مقطع صوتي
        // (صوت الحرف + صوت كل كلمة + صوت الجملة) بمستند مستقل بذاته أيضاً - حتى لو حرف واحد فيه
        // 5 مقاطع صوتية (200 كيلوبايت تقريباً لكل مقطع)، فشل مزامنة مقطع واحد لن يؤثر على البقية.
        let phonicsSyncTimer = null;
        function schedulePhonicsSync(letters) {
            if (!cloudUid) return;
            if (phonicsSyncTimer) clearTimeout(phonicsSyncTimer);
            phonicsSyncTimer = setTimeout(() => syncPhonicsNow(letters), 1500);
        }

        async function syncPhonicsNow(letters) {
            if (!cloudUid) return;
            try {
                const userRef = firebase.firestore().collection('users').doc(cloudUid);
                const failedItems = [];
                const writes = [];

                letters.forEach((L, idx) => {
                    writes.push(
                        userRef.collection('phonicsMeta').doc(L.id).set(sanitizeForFirestore({
                            letter: L.letter, order: idx,
                            wordTexts: (L.words || []).map(w => w.text),
                            sentenceText: L.sentence ? L.sentence.text : ''
                        })).catch(err => console.error('فشل مزامنة بيانات حرف:', L.id, err))
                    );

                    if (L.letterAudio) {
                        writes.push(
                            userRef.collection('phonicsAudio').doc(L.id + '_letter').set(sanitizeForFirestore({ letterId: L.id, slot: 'letter', dataUrl: L.letterAudio }))
                                .catch(err => { console.error('فشل مزامنة صوت حرف:', L.id, err); failedItems.push('صوت الحرف ' + L.letter); })
                        );
                    }
                    (L.words || []).forEach((w, wIdx) => {
                        if (w.audio) {
                            writes.push(
                                userRef.collection('phonicsAudio').doc(L.id + '_word' + wIdx).set(sanitizeForFirestore({ letterId: L.id, slot: 'word' + wIdx, dataUrl: w.audio }))
                                    .catch(err => { console.error('فشل مزامنة صوت كلمة:', L.id, wIdx, err); failedItems.push('كلمة "' + w.text + '"'); })
                            );
                        }
                    });
                    if (L.sentence && L.sentence.audio) {
                        writes.push(
                            userRef.collection('phonicsAudio').doc(L.id + '_sentence').set(sanitizeForFirestore({ letterId: L.id, slot: 'sentence', dataUrl: L.sentence.audio }))
                                .catch(err => { console.error('فشل مزامنة صوت جملة:', L.id, err); failedItems.push('جملة الحرف ' + L.letter); })
                        );
                    }
                });

                await Promise.allSettled(writes);
                if (failedItems.length > 0) {
                    if (window.notifyCloudSyncFailure) window.notifyCloudSyncFailure(failedItems[0] + ' (على الأغلب ملف صوتي كبير الحجم)');
                }
            } catch (err) {
                console.error('خطأ غير متوقع أثناء مزامنة الصوتيات:', err);
                if (window.notifyCloudSyncFailure) window.notifyCloudSyncFailure('خطأ غير متوقع في مزامنة الصوتيات: ' + (err && err.message ? err.message : String(err)));
            }
        }

        async function loadPhonicsFromCloud(uid) {
            try {
                const userRef = firebase.firestore().collection('users').doc(uid);
                const [metaSnap, audioSnap] = await Promise.all([
                    userRef.collection('phonicsMeta').get({ source: 'server' }),
                    userRef.collection('phonicsAudio').get({ source: 'server' })
                ]);
                if (metaSnap.empty) return false;

                const audioByLetter = {};
                audioSnap.forEach(docSnap => {
                    const a = docSnap.data();
                    if (!audioByLetter[a.letterId]) audioByLetter[a.letterId] = {};
                    audioByLetter[a.letterId][a.slot] = a.dataUrl;
                });

                const ordered = [];
                metaSnap.forEach(docSnap => {
                    const meta = docSnap.data();
                    const audios = audioByLetter[docSnap.id] || {};
                    const wordTexts = meta.wordTexts || ['', '', ''];
                    ordered.push({
                        order: typeof meta.order === 'number' ? meta.order : 999,
                        letterObj: {
                            id: docSnap.id,
                            letter: meta.letter,
                            letterAudio: audios['letter'] || null,
                            words: wordTexts.map((t, i) => ({ id: docSnap.id + '_w' + i, text: t, audio: audios['word' + i] || null })),
                            sentence: { text: meta.sentenceText || '', audio: audios['sentence'] || null }
                        }
                    });
                });
                ordered.sort((a, b) => a.order - b.order);
                localStorage.setItem('phonics_letters', JSON.stringify(ordered.map(o => o.letterObj)));
                return true;
            } catch (err) {
                console.error('تعذر تحميل الصوتيات من السحابة:', err);
                return false;
            }
        }

        async function deleteLetterFromCloud(letterId) {
            if (!cloudUid) return;
            try {
                const userRef = firebase.firestore().collection('users').doc(cloudUid);
                await Promise.allSettled([
                    userRef.collection('phonicsMeta').doc(letterId).delete(),
                    userRef.collection('phonicsAudio').doc(letterId + '_letter').delete(),
                    userRef.collection('phonicsAudio').doc(letterId + '_word0').delete(),
                    userRef.collection('phonicsAudio').doc(letterId + '_word1').delete(),
                    userRef.collection('phonicsAudio').doc(letterId + '_word2').delete(),
                    userRef.collection('phonicsAudio').doc(letterId + '_sentence').delete()
                ]);
            } catch (err) {
                console.error('تعذر حذف الحرف من السحابة:', err);
            }
        }

        function scheduleCloudSync(key, value) {
            if (!cloudUid) return; // لا يوجد مستخدم مسجل دخول بعد
            if (cloudSyncTimers[key]) clearTimeout(cloudSyncTimers[key]);
            cloudSyncTimers[key] = setTimeout(() => {
                delete cloudSyncTimers[key];
                firebase.firestore().collection('users').doc(cloudUid).collection('data').doc(key)
                    .set({ value: value, updatedAt: Date.now() })
                    .then(() => { window.lastCloudSyncOk = true; })
                    .catch(err => {
                        console.error(`تعذرت مزامنة "${key}":`, err);
                        window.lastCloudSyncOk = false;
                        if (window.notifyCloudSyncFailure) window.notifyCloudSyncFailure(key);
                    });
            }, 1500);
        }

        // ضغط أي صورة (Base64) قبل حفظها محلياً وسحابياً: تصغير الأبعاد وإعادة الترميز بجودة JPEG معقولة.
        // هذا هو الإصلاح المجاني البديل عن Firebase Storage (المدفوع الآن): صورة كاميرا كاملة الدقة
        // (قد تتجاوز 3-5MB كنص Base64) تتحول بعد الضغط إلى أقل بكثير من 1MB بشكل يكاد يكون مضموناً.
        function compressImageDataUrl(dataUrl, maxDim = 900, quality = 0.65) {
            return new Promise((resolve) => {
                let settled = false;
                const finish = (val) => { if (!settled) { settled = true; resolve(val); } };
                // مهلة أمان: لو تعطلت المعالجة لأي سبب (جهاز بطيء، صورة كبيرة جداً)، لا نترك المستخدم منتظراً للأبد
                const safetyTimer = setTimeout(() => finish(dataUrl), 8000);
                try {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            let { width, height } = img;
                            if (width > maxDim || height > maxDim) {
                                if (width >= height) { height = Math.round(height * maxDim / width); width = maxDim; }
                                else { width = Math.round(width * maxDim / height); height = maxDim; }
                            }
                            const canvas = document.createElement('canvas');
                            canvas.width = width; canvas.height = height;
                            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                            clearTimeout(safetyTimer);
                            finish(canvas.toDataURL('image/jpeg', quality));
                        } catch (e) {
                            clearTimeout(safetyTimer);
                            finish(dataUrl); // فشل الترميز؟ استخدم الأصل بدل فقدان الصورة
                        }
                    };
                    img.onerror = () => { clearTimeout(safetyTimer); finish(dataUrl); };
                    img.src = dataUrl;
                } catch (err) {
                    clearTimeout(safetyTimer);
                    finish(dataUrl);
                }
            });
        }

        // ============ نظام الأصوات التفاعلية (بدون ملفات خارجية) ============
        let audioCtx = null;
        function getAudioCtx() {
            if (!audioCtx) {
                try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }
        function playTone(freq, duration, startTime, volume, type = 'sine') {
            const ctx = getAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0, ctx.currentTime + startTime);
            gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + startTime + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + startTime + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + startTime);
            osc.stop(ctx.currentTime + startTime + duration + 0.02);
        }

        // توليد صورة مصغرة لأول صفحة من ملف PDF (لعرضها ببطاقة المستند)
        async function generatePdfThumbnail(dataUrl) {
            try {
                if (!window['pdfjsLib']) return null;
                const pdf = await window['pdfjsLib'].getDocument(dataUrl).promise;
                const page = await pdf.getPage(1);
                const viewport = page.getViewport({ scale: 0.5 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                return canvas.toDataURL('image/jpeg', 0.7);
            } catch (err) {
                console.error('تعذر توليد صورة مصغرة لملف PDF:', err);
                return null;
            }
        }

        // استخراج كل نص ملف PDF (كل الصفحات) ليصبح قابلاً للتحديد والتعديل والترجمة والحفظ
        async function extractPdfText(dataUrl) {
            try {
                if (!window['pdfjsLib']) return '';
                const pdf = await window['pdfjsLib'].getDocument(dataUrl).promise;
                let fullText = '';
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();
                    const pageText = textContent.items.map(item => item.str).join(' ');
                    fullText += `--- Page ${i} ---\n${pageText}\n\n`;
                }
                return fullText.trim();
            } catch (err) {
                console.error('تعذر استخراج نص ملف PDF:', err);
                return '';
            }
        }

        function decodeUnicodeBase64(str) {
            return decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + c.charCodeAt(0).toString(16).padStart(2, '0')).join(''));
        }
        function getPlannerHTML() {
            try { return decodeUnicodeBase64(PLANNER_HTML_B64); } catch (e) { console.error('تعذر تحميل صفحة التخطيط:', e); return '<p style=\"padding:20px;font-family:sans-serif\">تعذر تحميل صفحة التخطيط.</p>'; }
        }

        // شاشة "التخطيط": تعرض تطبيق Life Tracker المستقل كاملاً داخل iframe (بياناته محفوظة في localStorage الخاص به تحت مفتاح lifeTrackerTasks)
        function PlanningScreen({ onBack }) {
            const plannerHtml = useMemo(() => getPlannerHTML(), []);
            return (
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <BackButton onClick={onBack} />
                        <h2 class="text-lg font-bold text-slate-700 dark:text-slate-200">📅 التخطيط</h2>
                    </div>
                    <iframe
                        srcDoc={plannerHtml}
                        title="التخطيط"
                        class="w-full rounded-2xl border border-slate-200 dark:border-slate-700 bg-white"
                        style={{ height: 'calc(100vh - 190px)' }}
                    ></iframe>
                </div>
            );
        }

            "تأثير التراكم المعرفي شبيه بكرة الثلج، يبدأ صغيراً ثم يكتسح.",
            "تعلم اللغة هو استثمارك الأضمن للمستقبل المهني والشخصي.",
            "الفارق الوحيد بين المتقن للمبتدئ هو الالتزام والصبر.",
            "اجعل اللغة جزءاً من روتينك اليومي، كشرب الماء تماماً.",
            "التحديات التي تواجهها الآن في فهم النطق ستصبح ذكريات مضحكة غداً.",
            "بمجرد تمكنك من الإنجليزية، ستجد أن أبواب المعرفة فُتحت على مصراعيها.",
            "من يتعلم لغة جديدة يحصل على عقل ثانٍ ورؤية أعمق للحياة."
        ];

        // جمل تحفيزية إنجليزية قصيرة (تُستخدم في لوحة الزر العائم بالصفحة الرئيسية)
        const ENGLISH_QUOTES = [
            "Small progress is still progress.",
            "Consistency beats intensity.",
            "Your future self is watching you right now.",
            "Discipline is choosing what you want most over what you want now.",
            "Every word you learn today is a door you open tomorrow.",
            "Don't wait for motivation, build the habit.",
            "One page today is a book by the end of the year.",
            "Growth is uncomfortable, but so is staying the same.",
            "You don't have to be great to start, but you have to start to be great.",
            "Success is the sum of small efforts repeated daily."
        ];


        // أدوات مساعدة للتاريخ (لحساب الاستمرارية والتذكيرات اليومية)
        // مفتاح "اليوم" يجب أن يُحسب بالتوقيت المحلي للمستخدم وليس UTC (toISOString يحوّل دائماً
        // للتوقيت العالمي) - وهذا كان السبب الحقيقي لانكسار السلسلة رغم النشاط الفعلي المتواصل،
        // لأن استخدام التطبيق قرب منتصف الليل بتوقيت العراق (UTC+3) كان يجعل "اليوم" المحسوب يتراجع
        // ليوم كامل للخلف أحياناً بسبب فرق التوقيت.
        const todayKey = () => {
            const d = new Date();
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };
        const daysBetween = (d1, d2) => Math.round((new Date(d2) - new Date(d1)) / 86400000);

        // مجموعة تذكيرات افتراضية تُستخدم للتعبئة التلقائية بعد الساعة 12 ظهراً
        const DEFAULT_REMINDER_POOL = [
            'راجع 20 كلمة في قسم المفردات',
            'اقرأ 15 دقيقة في قسم القراءة',
            'استمع لمدة 10 دقائق من مصدر مفضل',
            'اكتب فقرة قصيرة في قسم الكتابة',
            'مارس تقنية الـ Shadowing لمدة 10 دقائق',
            'تحدث بصوت عالٍ لمدة 5 دقائق أمام المرآة'
        ];

        // ترحيل لمرة واحدة: نضمن أن الاستمرارية تبدأ فعلياً من 1 في هذا الإصدار المحدث (حتى لو كان مخزّناً سابقاً رقم مختلف في المتصفح)
        (function migrateStreakDataOnce() {
            const MIGRATION_FLAG = 'streak_reset_v2';
            if (localStorage.getItem('app_migration_flag') !== MIGRATION_FLAG) {
                localStorage.setItem('streak_count', '1');
                localStorage.setItem('streak_last_active', new Date().toISOString().slice(0, 10));
                localStorage.setItem('app_migration_flag', MIGRATION_FLAG);
            }
        })();

        // ترحيل تصحيحي: إصلاح خطأ حساب "اليوم" بتوقيت UTC كان يكسر السلسلة رغم النشاط الفعلي
        // المتواصل. إذا كان آخر نشاط مسجّل هو اليوم أو أمس فعلياً (بالتوقيت المحلي الصحيح الجديد)
        // لكن السلسلة صفر أو واحد بسبب الخطأ القديم، نعيدها لقيمة معقولة تعكس استمراريتك الحقيقية.
        (function fixStreakTimezoneBugOnce() {
            const MIGRATION_FLAG = 'streak_tz_fix_v3';
            if (localStorage.getItem('app_migration_flag') === MIGRATION_FLAG) return;
            try {
                const last = localStorage.getItem('streak_last_active');
                const currentStreak = parseInt(localStorage.getItem('streak_count') || '0', 10);
                if (last) {
                    const gap = Math.abs(daysBetween(last, todayKey()));
                    if (gap <= 1 && currentStreak <= 1) {
                        localStorage.setItem('streak_count', '2');
                    }
                }
            } catch (err) { /* تجاهل */ }
            localStorage.setItem('app_migration_flag', MIGRATION_FLAG);
        })();

        // ==========================================
        // 2. APP UI & SCREENS
        // ==========================================
        function App({ onLogout, userEmail }) {
            const [currentTab, setCurrentTab] = useState('home');
            const [darkMode, setDarkMode] = useState(false);
            const [syncWarning, setSyncWarning] = useState(null);

            useEffect(() => {
                window.notifyCloudSyncFailure = (key) => {
                    setSyncWarning('تعذّرت مزامنة بعض بياناتك مع السحابة (يُحتمل بسبب حجم الملفات/الصور الكبير أو ضعف الاتصال). بياناتك محفوظة على هذا الجهاز، لكن قد لا تظهر على أجهزتك الأخرى حتى تُحل المشكلة.');
                };
                return () => { window.notifyCloudSyncFailure = null; };
            }, []);

            // STATE FOR GLOBAL PROGRESS (STUDY CIRCLE)
            const [streaks, setStreaks] = useState(() => {
                const saved = localStorage.getItem('streak_count');
                return saved !== null ? parseInt(saved, 10) : 1;
            });
            const [lastActiveDate, setLastActiveDate] = useState(() => {
                return localStorage.getItem('streak_last_active') || todayKey();
            });
            const [dailyProgress, setDailyProgress] = useState({
                reading: 0, listening: 0, speaking: 0, writing: 0, shadowing: 0, vocabulary: 0, words: 0, books: 0
            });

            // تذكيرات اليوم (يكتبها المستخدم بنفسه، بحد أقصى 4، وتُستكمل تلقائياً بعد الساعة 12 ظهراً)
            const [dailyReminders, setDailyReminders] = useState(() => {
                const saved = localStorage.getItem('daily_reminders');
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                return parsed.date === todayKey() ? parsed.items : [];
            });

            // (تم حذف قسمي "الفروقات" و "الكلمات" نهائياً بطلب المستخدم)

            // كتبي وتقدم الكورسات
            const [completedLessons, setCompletedLessons] = useState(() => {
                const saved = localStorage.getItem('completed_lessons');
                return saved ? JSON.parse(saved) : {};
            });

            const [grammarStatus, setGrammarStatus] = useState(() => {
                const saved = localStorage.getItem('grammar_status');
                return saved ? JSON.parse(saved) : { currentRound: 1, checkedBoxes: {} };
            });

            // شاشة الممارسة العامة - مصادر وملفات القراءة (منقسمة إلى جديد / تم القراءة)
            const [readingSources, setReadingSources] = useState(() => {
                const saved = localStorage.getItem('reading_sources');
                return saved ? JSON.parse(saved) : [null, null, null, null];
            });
            const [readingUnitsNew, setReadingUnitsNew] = useState(() => {
                const saved = localStorage.getItem('reading_units_new');
                return saved ? JSON.parse(saved) : [];
            });
            const [readingUnitsRead, setReadingUnitsRead] = useState(() => {
                const saved = localStorage.getItem('reading_units_read');
                return saved ? JSON.parse(saved) : [];
            });

            // شاشة الكتابة
            const [writingTopics, setWritingTopics] = useState(() => {
                const saved = localStorage.getItem('writing_topics');
                return saved ? JSON.parse(saved) : [];
            });
            const [writingSuggestions, setWritingSuggestions] = useState(() => {
                const saved = localStorage.getItem('writing_suggestions');
                return saved ? JSON.parse(saved) : [];
            });

            // شاشة الاستماع
            const [listeningSources, setListeningSources] = useState(() => {
                const saved = localStorage.getItem('listening_sources');
                return saved ? JSON.parse(saved) : [null, null, null, null];
            });
            const [listeningUnitsNew, setListeningUnitsNew] = useState(() => {
                const saved = localStorage.getItem('listening_units_new');
                return saved ? JSON.parse(saved) : [];
            });
            const [listeningUnitsCompleted, setListeningUnitsCompleted] = useState(() => {
                const saved = localStorage.getItem('listening_units_completed');
                return saved ? JSON.parse(saved) : [];
            });

            // شاشة التحدث
            const [speakingSources, setSpeakingSources] = useState(() => {
                const saved = localStorage.getItem('speaking_sources');
                return saved ? JSON.parse(saved) : [null, null];
            });
            const [speakingSuggestions, setSpeakingSuggestions] = useState(() => {
                const saved = localStorage.getItem('speaking_suggestions');
                return saved ? JSON.parse(saved) : [];
            });

            // شاشة Shadowing
            const [shadowingSources, setShadowingSources] = useState(() => {
                const saved = localStorage.getItem('shadowing_sources');
                return saved ? JSON.parse(saved) : [null, null, null, null];
            });
            const [shadowingUnitsNew, setShadowingUnitsNew] = useState(() => {
                const saved = localStorage.getItem('shadowing_units_new');
                return saved ? JSON.parse(saved) : [];
            });

            // قسم أخرى
            const [otherElements, setOtherElements] = useState(() => {
                const saved = localStorage.getItem('other_elements');
                return saved ? JSON.parse(saved) : [];
            });

            // قسم الصوتيات (Phonics)
            const [phonicsLetters, setPhonicsLetters] = useState(() => {
                const saved = localStorage.getItem('phonics_letters');
                return saved ? JSON.parse(saved) : [];
            });

            // ==== مناطق خريطة الرئيسية الجديدة: قراءة حرة / ترفيه / مهارات حرة ====
            // كل عنصر: { id, icon, name, duration, url }
            const [lifeReadingItems, setLifeReadingItems] = useState(() => {
                const saved = localStorage.getItem('life_reading_items');
                return saved ? JSON.parse(saved) : [];
            });
            const [lifeEntertainmentItems, setLifeEntertainmentItems] = useState(() => {
                const saved = localStorage.getItem('life_entertainment_items');
                return saved ? JSON.parse(saved) : [];
            });
            const [lifeFreeSkillsItems, setLifeFreeSkillsItems] = useState(() => {
                const saved = localStorage.getItem('life_freeskills_items');
                return saved ? JSON.parse(saved) : [];
            });

            // Save Databases to LocalStorage on Change
            useEffect(() => { safeSetLocalStorage('completed_lessons', JSON.stringify(completedLessons)); }, [completedLessons]);
            useEffect(() => { safeSetLocalStorage('grammar_status', JSON.stringify(grammarStatus)); }, [grammarStatus]);
            useEffect(() => { safeSetLocalStorage('reading_sources', JSON.stringify(readingSources)); }, [readingSources]);
            useEffect(() => { safeSetLocalStorage('reading_units_new', JSON.stringify(readingUnitsNew)); }, [readingUnitsNew]);
            useEffect(() => { safeSetLocalStorage('reading_units_read', JSON.stringify(readingUnitsRead)); }, [readingUnitsRead]);
            useEffect(() => { safeSetLocalStorage('writing_topics', JSON.stringify(writingTopics)); }, [writingTopics]);
            useEffect(() => { safeSetLocalStorage('writing_suggestions', JSON.stringify(writingSuggestions)); }, [writingSuggestions]);
            useEffect(() => { safeSetLocalStorage('listening_sources', JSON.stringify(listeningSources)); }, [listeningSources]);
            useEffect(() => { safeSetLocalStorage('listening_units_new', JSON.stringify(listeningUnitsNew)); }, [listeningUnitsNew]);
            useEffect(() => { safeSetLocalStorage('listening_units_completed', JSON.stringify(listeningUnitsCompleted)); }, [listeningUnitsCompleted]);
            useEffect(() => { safeSetLocalStorage('speaking_sources', JSON.stringify(speakingSources)); }, [speakingSources]);
            useEffect(() => { safeSetLocalStorage('speaking_suggestions', JSON.stringify(speakingSuggestions)); }, [speakingSuggestions]);
            useEffect(() => { safeSetLocalStorage('shadowing_sources', JSON.stringify(shadowingSources)); }, [shadowingSources]);
            useEffect(() => { safeSetLocalStorage('shadowing_units_new', JSON.stringify(shadowingUnitsNew)); }, [shadowingUnitsNew]);
            useEffect(() => { safeSetLocalStorage('life_reading_items', JSON.stringify(lifeReadingItems)); }, [lifeReadingItems]);
            useEffect(() => { safeSetLocalStorage('life_entertainment_items', JSON.stringify(lifeEntertainmentItems)); }, [lifeEntertainmentItems]);
            useEffect(() => { safeSetLocalStorage('life_freeskills_items', JSON.stringify(lifeFreeSkillsItems)); }, [lifeFreeSkillsItems]);
            useEffect(() => { safeSetLocalStorage('other_elements', JSON.stringify(otherElements)); }, [otherElements]);
            useEffect(() => {
                try { localStorage.setItem('phonics_letters', JSON.stringify(phonicsLetters)); } catch (err) { console.error('تعذر حفظ الصوتيات محلياً:', err); }
                schedulePhonicsSync(phonicsLetters); // مزامنة دقيقة لكل مقطع صوتي على حدة، بنفس أسلوب بطاقات SRS الآمن
            }, [phonicsLetters]);
            useEffect(() => { safeSetLocalStorage('streak_count', String(streaks)); }, [streaks]);
            useEffect(() => { safeSetLocalStorage('streak_last_active', lastActiveDate); }, [lastActiveDate]);
            useEffect(() => { safeSetLocalStorage('daily_reminders', JSON.stringify({ date: todayKey(), items: dailyReminders })); }, [dailyReminders]);

            // Dark Mode Effect
            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [darkMode]);

            // فحص كسر الاستمرارية عند فتح التطبيق: غياب يومين متتاليين كاملين يكسر السلسلة
            useEffect(() => {
                const today = todayKey();
                const last = localStorage.getItem('streak_last_active');
                if (last && last !== today) {
                    const gap = daysBetween(last, today); // عدد الأيام الفاصلة
                    // gap = 1: نشط أمس (طبيعي) | gap = 2: غاب يوم واحد فقط (لا يزال ضمن السماح)
                    // gap >= 3: يعني يومين كاملين متتاليين بلا أي نشاط -> تنكسر السلسلة
                    if (gap >= 3) {
                        setStreaks(0);
                    }
                }
            }, []);

            // تسجيل أول نشاط في اليوم: يزيد الاستمرارية مرة واحدة فقط باليوم
            const registerActivityToday = () => {
                const today = todayKey();
                setLastActiveDate(prevDate => {
                    if (prevDate !== today) {
                        setStreaks(prevStreak => prevStreak + 1);
                        return today;
                    }
                    return prevDate;
                });
            };

            // تعبئة تلقائية للتذكيرات بعد الساعة 12 ظهراً إن لم يكملها المستخدم بنفسه
            useEffect(() => {
                const checkAutoFillReminders = () => {
                    const now = new Date();
                    if (now.getHours() >= 12) {
                        setDailyReminders(prev => {
                            if (prev.length >= 4) return prev;
                            const need = 4 - prev.length;
                            const existingTexts = prev.map(r => r.text);
                            const pool = DEFAULT_REMINDER_POOL.filter(p => !existingTexts.includes(p));
                            const additions = pool.slice(0, need).map((text, i) => ({
                                id: 'auto_' + Date.now() + '_' + i,
                                text,
                                done: false,
                                auto: true
                            }));
                            return additions.length ? [...prev, ...additions] : prev;
                        });
                    }
                };
                checkAutoFillReminders();
                const interval = setInterval(checkAutoFillReminders, 60000);
                return () => clearInterval(interval);
            }, []);

            // Calculate current Study Circle Percentage
            const currentProgressPercentage = useMemo(() => {
                const values = Object.values(dailyProgress);
                const sum = values.reduce((acc, val) => acc + val, 0);
                return Math.min(100, Math.round((sum / 200) * 100)); // target 200 units overall
            }, [dailyProgress]);

            // عدد الأيام المتبقية من السنة الحالية (يُحسب مرة واحدة عند فتح التطبيق)
            const yearDaysRemaining = useMemo(() => {
                const now = new Date();
                const endOfYear = new Date(now.getFullYear(), 11, 31);
                return Math.max(0, Math.ceil((endOfYear - now) / 86400000));
            }, []);

            // إضافة وقت مهارة معينة (تُستخدم من قبل المؤقتات الفردية داخل ملخص نشاط اليوم)
            const addSkillTime = (skillKey, minutes) => {
                setDailyProgress(prev => ({ ...prev, [skillKey]: prev[skillKey] + minutes }));
                registerActivityToday();
            };

            const makeStatAdder = (skillKey) => (amount = 1) => {
                setDailyProgress(prev => ({ ...prev, [skillKey]: prev[skillKey] + amount }));
                registerActivityToday();
            };

            return (
                <div class="min-h-screen flex flex-col pb-6 bg-white dark:bg-slate-900">
                    {/* Header */}
                    <header class="sticky top-0 z-40 bg-white/80 dark:bg-slate-900/80 backdrop-blur border-b border-slate-100 dark:border-slate-800 px-6 py-4 flex justify-between items-center">
                        <div class="flex items-center gap-2">
                            <img src={window.APP_LOGO} class="w-10 h-10 rounded-xl object-cover" />
                            <div>
                                <h1 class="text-xl font-extrabold text-primary-600 dark:text-primary-500">Study Circle</h1>
                                <p class="text-xs text-slate-400">رحلتك نحو طلاقة الإنجليزية</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-4">
                            <button onClick={() => setDarkMode(!darkMode)} class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-500 dark:text-slate-400">
                                {darkMode ? <i data-lucide="sun" class="w-5 h-5 text-amber-500"></i> : <i data-lucide="moon" class="w-5 h-5"></i>}
                            </button>
                            <div class="flex flex-col items-center gap-1">
                                <span class="text-[9px] font-bold text-slate-400 dark:text-slate-500 font-inter">📅 {yearDaysRemaining} يوم متبقٍ</span>
                                <div class="flex items-center gap-1 bg-amber-50 dark:bg-amber-950/30 text-amber-600 px-3 py-1.5 rounded-full font-bold text-sm">
                                    <i data-lucide="flame" class="w-4 h-4 fill-current"></i>
                                    <span class="font-inter">{streaks} Days</span>
                                </div>
                            </div>
                            {onLogout && (
                                <button onClick={onLogout} title={userEmail || 'تسجيل الخروج'} class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-400 hover:text-red-500">
                                    <i data-lucide="log-out" class="w-5 h-5"></i>
                                </button>
                            )}
                        </div>
                    </header>

                    {syncWarning && (
                        <div class="bg-amber-50 dark:bg-amber-950/30 border-b border-amber-200 dark:border-amber-900 px-6 py-2.5 flex items-center justify-between gap-3">
                            <div class="flex items-center gap-2 text-amber-700 dark:text-amber-400 text-xs font-bold">
                                <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0"></i>
                                <span>{syncWarning}</span>
                            </div>
                            <button onClick={() => setSyncWarning(null)} class="text-amber-500 hover:text-amber-700 shrink-0">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                        </div>
                    )}

                    {/* Main Content Render */}
                    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6">
                        {currentTab === 'home' && (
                            <HomeScreen
                                streaks={streaks}
                                dailyProgress={dailyProgress}
                                currentProgressPercentage={currentProgressPercentage}
                                onNavigate={setCurrentTab}
                                onAddSkillTime={addSkillTime}
                                dailyReminders={dailyReminders}
                                setDailyReminders={setDailyReminders}
                            />
                        )}
                        {currentTab === 'practice' && <PracticeHubScreen onNavigate={setCurrentTab} />}
                        {currentTab === 'books' && (
                            <BooksScreen
                                completedLessons={completedLessons}
                                setCompletedLessons={setCompletedLessons}
                                grammarStatus={grammarStatus}
                                setGrammarStatus={setGrammarStatus}
                                onAddStats={makeStatAdder('books')}
                                onBack={() => setCurrentTab('practice')}
                            />
                        )}
                        {currentTab === 'motivation' && <MotivationScreen onBack={() => setCurrentTab('home')} />}
                        {currentTab === 'reading' && (
                            <ReadingScreen
                                sources={readingSources}
                                setSources={setReadingSources}
                                unitsNew={readingUnitsNew}
                                setUnitsNew={setReadingUnitsNew}
                                unitsRead={readingUnitsRead}
                                setUnitsRead={setReadingUnitsRead}
                                onAddStats={makeStatAdder('reading')}
                                onBack={() => setCurrentTab('practice')}
                            />
                        )}
                        {currentTab === 'writing' && (
                            <WritingScreen
                                topics={writingTopics}
                                setWritingTopics={setWritingTopics}
                                suggestions={writingSuggestions}
                                setSuggestions={setWritingSuggestions}
                                onAddStats={makeStatAdder('writing')}
                                onBack={() => setCurrentTab('practice')}
                            />
                        )}
                        {currentTab === 'listening' && (
                            <ListeningScreen
                                sources={listeningSources}
                                setSources={setListeningSources}
                                unitsNew={listeningUnitsNew}
                                setUnitsNew={setListeningUnitsNew}
                                unitsCompleted={listeningUnitsCompleted}
                                setUnitsCompleted={setListeningUnitsCompleted}
                                onAddStats={makeStatAdder('listening')}
                                onBack={() => setCurrentTab('practice')}
                            />
                        )}
                        {currentTab === 'speaking' && (
                            <SpeakingScreen
                                sources={speakingSources}
                                setSources={setSpeakingSources}
                                suggestions={speakingSuggestions}
                                setSuggestions={setSpeakingSuggestions}
                                onAddStats={makeStatAdder('speaking')}
                                onBack={() => setCurrentTab('practice')}
                            />
                        )}
                        {currentTab === 'shadowing' && (
                            <ShadowingScreen
                                sources={shadowingSources}
                                setSources={setShadowingSources}
                                unitsNew={shadowingUnitsNew}
                                setUnitsNew={setShadowingUnitsNew}
                                onAddStats={makeStatAdder('shadowing')}
                                onBack={() => setCurrentTab('practice')}
                            />
                        )}
                        {currentTab === 'phonics' && (
                            <PhonicsScreen
                                letters={phonicsLetters}
                                setLetters={setPhonicsLetters}
                                onBack={() => setCurrentTab('practice')}
                            />
                        )}
                        {currentTab === 'other' && (
                            <OtherScreen elements={otherElements} setElements={setOtherElements} onBack={() => setCurrentTab('practice')} />
                        )}
                        {currentTab === 'area_reading' && (
                            <SimpleListAreaScreen
                                title="القراءة"
                                emoji="📖"
                                color="emerald"
                                items={lifeReadingItems}
                                setItems={setLifeReadingItems}
                                placeholderName="مثال: Atomic Habits"
                                onBack={() => setCurrentTab('home')}
                            />
                        )}
                        {currentTab === 'area_entertainment' && (
                            <SimpleListAreaScreen
                                title="الترفيه"

        // ==========================================
        // شاشة موحّدة لمناطق الخريطة البسيطة: القراءة الحرة / الترفيه / المهارات الحرة

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [items, isAdding]);

            const colorMap = {
                emerald: 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/30 dark:text-emerald-400',
                purple: 'bg-purple-100 text-purple-600 dark:bg-purple-900/30 dark:text-purple-400',

            const openAdd = () => {
                setFormIcon(emoji); setFormName(''); setFormDuration(''); setFormUrl('');

            const handleSave = () => {

                const newItem = {

                    duration: formDuration.trim(),

                setIsAdding(false);

            const handleDelete = (id) => {

                    <div class="flex items-center justify-between">
                        <BackButton onClick={onBack} />
                        <h2 class="text-lg font-bold text-slate-700 dark:text-slate-200">{emoji} {title}</h2>
                    </div>

                    <div class="space-y-3">
                        {items.map(item => (

                                <div class={`w-11 h-11 rounded-xl flex items-center justify-center text-xl shrink-0 ${badgeColor}`}>

                                <input type="text" value={formUrl} onChange={(e) => setFormUrl(e.target.value)} placeholder="رابط (اختياري)" class="w-full border border-slate-200 dark:border-slate-700 dark:bg-slate-900 p-3 rounded-xl text-sm" dir="ltr" />

                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================

        function HomeScreen({ streaks, dailyProgress, currentProgressPercentage, onNavigate, onAddSkillTime, dailyReminders, setDailyReminders }) {

            // مناطق خريطة العالم الشخصية - مرتّبة في شبكة 2×3 تطابق مواضع الجزر في الصورة

                                    <h3 class="text-lg font-bold">نظرة سريعة</h3>

        // مؤقت (Stopwatch) صغير لكل مهارة، يتفاعل مع Study Circle وملخص نشاط اليوم
        function ActivityMetricItem({ icon, title, value, color, skillKey, onAddSkillTime }) {
            const [running, setRunning] = useState(false);
            const [seconds, setSeconds] = useState(0);
            const intervalRef = useRef(null);

            useEffect(() => {
                if (running) {
                    intervalRef.current = setInterval(() => setSeconds(s => s + 1), 1000);
                } else if (intervalRef.current) {
                    clearInterval(intervalRef.current);
                }
                return () => clearInterval(intervalRef.current);
            }, [running]);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [running]);

            const handleToggle = () => {
                if (running && seconds > 0) {
                    onAddSkillTime(skillKey, seconds / 60);
                    setSeconds(0);
                }
                setRunning(!running);
            };

            const mm = String(Math.floor(seconds / 60)).padStart(2, '0');
            const ss = String(seconds % 60).padStart(2, '0');

            return (
                <div class="flex items-center gap-2.5 p-3 border border-slate-50 dark:border-slate-700/30 rounded-2xl bg-slate-50/50 dark:bg-slate-800/50">
                    <div class={`w-9 h-9 rounded-xl flex items-center justify-center shrink-0 ${color}`}>
                        <i data-lucide={icon} class="w-4.5 h-4.5"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-xs text-slate-400">{title}</p>
                        <p class="font-bold text-slate-700 dark:text-slate-200 font-inter text-xs mt-0.5">{value}</p>
                    </div>
                    {skillKey && onAddSkillTime && (
                        <div class="flex items-center gap-1 shrink-0">
                            {running && <span class="text-[9px] font-inter text-slate-400">{mm}:{ss}</span>}
                            <button onClick={handleToggle} class={`w-6 h-6 rounded-full flex items-center justify-center text-white ${running ? 'bg-red-500' : 'bg-primary-500'}`}>
                                <i data-lucide={running ? 'pause' : 'play'} class="w-3 h-3"></i>
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        // قسم تذكيرات اليوم: يكتب المستخدم حتى 4 تذكيرات، وتُستكمل تلقائياً إن لم يكتب شيئاً قبل الساعة 12 ظهراً
        function TodayReminders({ dailyReminders, setDailyReminders }) {
            const [newReminderText, setNewReminderText] = useState('');
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [dailyReminders]);

            const handleAddReminder = () => {
                if (!newReminderText.trim() || dailyReminders.length >= 4) return;
                setDailyReminders([...dailyReminders, { id: Date.now().toString(), text: newReminderText, done: false, auto: false }]);
                setNewReminderText('');
            };

            const toggleReminder = (id) => {
                setDailyReminders(dailyReminders.map(r => r.id === id ? { ...r, done: !r.done } : r));
            };

            const deleteReminder = (id) => {
                setDailyReminders(dailyReminders.filter(r => r.id !== id));
            };

            return (
                <div class="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700/50 rounded-3xl p-6">
                    <div class="flex items-center gap-2 mb-4 justify-between">
                        <div class="flex items-center gap-2">
                            <i data-lucide="check-circle" class="text-primary-500 w-5 h-5"></i>
                            <h3 class="text-lg font-bold text-slate-700 dark:text-slate-200">تذكيرات المهام اليومية</h3>
                        </div>
                        <span class="text-[10px] font-inter text-slate-400">{dailyReminders.length}/4</span>
                    </div>

                    <div class="space-y-2">
                        {dailyReminders.map(r => (
                            <div key={r.id} class="flex items-center gap-3 p-3 bg-slate-50 dark:bg-slate-800/30 rounded-xl">
                                <label onClick={() => toggleReminder(r.id)} class="flex items-center gap-3 cursor-pointer flex-1">
                                    <input type="checkbox" checked={r.done} onChange={() => {}} class="w-5 h-5 accent-primary-500 rounded border-slate-300 text-primary-500" />
                                    <span class={`text-sm ${r.done ? 'line-through text-slate-400' : 'text-slate-600 dark:text-slate-300'}`}>{r.text}</span>
                                    {r.auto && <span class="text-[9px] bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded-full font-bold shrink-0">تلقائي</span>}
                                </label>
                                <button onClick={() => deleteReminder(r.id)} class="text-slate-300 hover:text-red-500 shrink-0">
                                    <i data-lucide="x" class="w-4 h-4"></i>
                                </button>
                            </div>
                        ))}
                        {dailyReminders.length === 0 && (
                            <p class="text-xs text-slate-400 text-center py-3">لم تُضِف أي تذكير بعد اليوم. أضف حتى 4 تذكيرات، وإن لم تكتبها قبل الساعة 12 ظهراً سيتم اقتراح تذكيرات تلقائياً.</p>
                        )}
                    </div>

                    {dailyReminders.length < 4 && (
                        <div class="flex gap-2 mt-3">
                            <input
                                type="text"
                                value={newReminderText}
                                onChange={(e) => setNewReminderText(e.target.value)}
                                onKeyDown={(e) => { if (e.key === 'Enter') handleAddReminder(); }}
                                placeholder="اكتب تذكيرك الخاص..."
                                class="flex-1 border border-slate-200 dark:border-slate-700 dark:bg-slate-900 p-2.5 rounded-xl text-xs"
                            />
                            <button onClick={handleAddReminder} class="bg-primary-500 text-white px-4 rounded-xl text-xs font-bold">إضافة</button>
                        </div>
                    )}
                </div>
            );
        }

        // ==========================================
        // مكوّن مساعد: إضافة صورة أو تسجيل صوتي من الملفات لأي حقل (وجه أمامي/خلفي...الخ)
        // ==========================================
        function MediaAttachments({ image, onImageChange, audio, onAudioChange, hideImage = false, hideAudio = false, onUploadingChange }) {
            const fileInputRef = useRef(null);
            const audioInputRef = useRef(null);
            const mediaRecorderRef = useRef(null);
            const chunksRef = useRef([]);
            const [isRecording, setIsRecording] = useState(false);
            const [uploadingImage, setUploadingImage] = useState(false);
            const [uploadingAudio, setUploadingAudio] = useState(false);
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [image, audio, isRecording, uploadingImage, uploadingAudio]);
            useEffect(() => { if (onUploadingChange) onUploadingChange(uploadingImage || uploadingAudio); }, [uploadingImage, uploadingAudio]);

            const handleImagePick = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async () => {
                    const dataUrl = reader.result;
                    onImageChange(dataUrl); // معاينة فورية محلياً
                    setUploadingImage(true);
                    const compressed = await compressImageDataUrl(dataUrl);
                    onImageChange(compressed); // نستبدلها بنسخة مضغوطة أصغر بكثير لتفادي تضخم بيانات المزامنة
                    setUploadingImage(false);
                };
                reader.readAsDataURL(file);
            };

            const handleAudioFilePick = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = () => { onAudioChange(reader.result); };
                reader.readAsDataURL(file);
            };

            const startRecording = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    const recorder = new MediaRecorder(stream);
                    chunksRef.current = [];
                    recorder.ondataavailable = (e) => chunksRef.current.push(e.data);
                    recorder.onstop = () => {
                        const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
                        const reader = new FileReader();
                        reader.onload = () => { onAudioChange(reader.result); };
                        reader.readAsDataURL(blob);
                        stream.getTracks().forEach(t => t.stop());
                    };
                    mediaRecorderRef.current = recorder;
                    recorder.start();
                    setIsRecording(true);
                } catch (err) {
                    alert('تعذّر الوصول إلى الميكروفون. تأكد من السماح للتطبيق باستخدامه.');
                }
            };

            const stopRecording = () => {
                if (mediaRecorderRef.current) mediaRecorderRef.current.stop();
                setIsRecording(false);
            };

            return (
                <div class="space-y-2">
                    <div class="flex items-center gap-2 flex-wrap">
                        {!hideImage && (
                            <React.Fragment>
                                <input type="file" accept="image/*" ref={fileInputRef} onChange={handleImagePick} class="hidden" />
                                <button type="button" onClick={() => fileInputRef.current.click()} class="flex items-center gap-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 px-3 py-1.5 rounded-lg text-[11px] font-bold">
                                    <i data-lucide="image" class="w-3.5 h-3.5"></i> إضافة صورة
                                </button>
                            </React.Fragment>
                        )}

                        <input type="file" accept="audio/*" ref={audioInputRef} onChange={handleAudioFilePick} class="hidden" />
                        {!hideAudio && (
                            <React.Fragment>
                                <button type="button" onClick={() => audioInputRef.current.click()} class="flex items-center gap-1 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-200 px-3 py-1.5 rounded-lg text-[11px] font-bold">
                                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> رفع صوت
                                </button>

                                {!isRecording ? (
                                    <button type="button" onClick={startRecording} class="flex items-center gap-1 bg-red-50 text-red-500 px-3 py-1.5 rounded-lg text-[11px] font-bold">
                                        <i data-lucide="mic" class="w-3.5 h-3.5"></i> تسجيل صوت
                                    </button>
                                ) : (
                                    <button type="button" onClick={stopRecording} class="flex items-center gap-1 bg-red-500 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold animate-pulse">
                                        <i data-lucide="square" class="w-3.5 h-3.5"></i> إيقاف التسجيل
                                    </button>
                                )}
                            </React.Fragment>
                        )}
                    </div>
                    {!hideImage && image && (
                        <div class="relative inline-block">
                            <img src={image} class="h-16 rounded-lg border border-slate-200" />
                            {uploadingImage && (
                                <div class="absolute inset-0 bg-slate-900/50 rounded-lg flex items-center justify-center">
                                    <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                                </div>
                            )}
                            <button type="button" onClick={() => onImageChange(null)} class="absolute -top-1.5 -left-1.5 bg-slate-800 text-white rounded-full w-4 h-4 flex items-center justify-center text-[9px]">×</button>
                        </div>
                    )}
                    {!hideAudio && audio && (
                        <div class="flex items-center gap-2">
                            <audio controls src={audio} class="h-8 max-w-[220px]"></audio>
                            {uploadingAudio && <span class="text-[10px] text-slate-400">جارٍ الرفع...</span>}
                            <button type="button" onClick={() => onAudioChange(null)} class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    )}
