        // ==========================================
        // مكوّن لوحة رسم/تعليق (بالقلم أو الإصبع) فوق الملف المعروض، مع إمكانية المسح والحفظ
        // ==========================================
        const PEN_COLORS = ['#1d4ed8', '#0f172a', '#dc2626', '#16a34a', '#7c3aed'];

        function AnnotationCanvas({ initialData, onSave, height = 900, maxViewHeight = 420, toolbarPosition = 'top' }) {
            const canvasRef = useRef(null);
            const wrapperRef = useRef(null);
            const drawingRef = useRef(false);
            const autoSaveTimerRef = useRef(null);
            const hasStrokeRef = useRef(false);
            const undoStackRef = useRef([]); // مكدس صور سابقة لدعم "تراجع خطوة" الحقيقي
            const [mode, setMode] = useState('pen'); // pen | eraser
            const [penColor, setPenColor] = useState(PEN_COLORS[0]);
            const [showColors, setShowColors] = useState(false);
            const [canUndo, setCanUndo] = useState(false);
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [mode, showColors]);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (initialData) {
                    const img = new Image();
                    img.onload = () => { if (canvasRef.current) ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };
                    img.src = initialData;
                }
                // حفظ تلقائي عند الخروج من هذه اللوحة (تغيير الصفحة/إغلاقها) حتى بدون ضغط أي زر
                // (مع حراسة null لتفادي انهيار كامل التطبيق "الشاشة البيضاء" في حال عدم توفر الكانفاس لحظة الإغلاق)
                return () => {
                    try {
                        if (hasStrokeRef.current && canvasRef.current) onSave(canvasRef.current.toDataURL('image/png'));
                    } catch (err) {
                        console.error('تعذر حفظ لوحة الكتابة عند الإغلاق:', err);
                    }
                };
                // eslint-disable-next-line
            }, []);

            const getPos = (e) => {
                const canvas = canvasRef.current;
                if (!canvas) return { x: 0, y: 0 };
                const rect = canvas.getBoundingClientRect();
                return { x: (e.clientX - rect.left) * (canvas.width / rect.width), y: (e.clientY - rect.top) * (canvas.height / rect.height) };
            };

            const scheduleAutoSave = () => {
                hasStrokeRef.current = true;
                if (autoSaveTimerRef.current) clearTimeout(autoSaveTimerRef.current);
                autoSaveTimerRef.current = setTimeout(() => {
                    if (canvasRef.current) onSave(canvasRef.current.toDataURL('image/png'));
                }, 900);
            };

            const pushUndoSnapshot = () => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                try {
                    undoStackRef.current.push(canvas.toDataURL('image/png'));
                    if (undoStackRef.current.length > 25) undoStackRef.current.shift(); // حد أقصى لتفادي استهلاك ذاكرة زائد
                    setCanUndo(true);
                } catch (err) { /* تجاهل */ }
            };

            // نعتمد Pointer Events بدل Touch Events لتمييز نوع اللمسة (قلم Apple Pencil مقابل إصبع/راحة اليد):
            // القلم أو الفأرة فقط يرسمان، أما لمسات الإصبع (بما فيها راحة اليد المرتاحة أثناء الكتابة)
            // تُترك بالكامل للمتصفح ليعالجها كتمرير طبيعي (Native Scroll) دون أي تدخل من كودنا - هذا
            // يحل جذرياً مشكلتي: (1) ظهور قائمة تحديد/نسخ عند لمس راحة اليد، و(2) التمرير غير السلس.
            const startDraw = (e) => {
                if (e.pointerType === 'touch') return; // اترك اللمسة للمتصفح (تمرير طبيعي أو راحة يد بلا أي تأثير)
                e.preventDefault();
                const canvas = canvasRef.current;
                if (!canvas) return;
                if (canvas.setPointerCapture) { try { canvas.setPointerCapture(e.pointerId); } catch (err) {} }
                pushUndoSnapshot();
                drawingRef.current = true;
                const ctx = canvas.getContext('2d');
                const { x, y } = getPos(e);
                ctx.beginPath();
                ctx.moveTo(x, y);
            };

            const draw = (e) => {
                if (e.pointerType === 'touch') return;
                if (!drawingRef.current) return;
                e.preventDefault();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                const { x, y } = getPos(e);
                ctx.lineWidth = mode === 'eraser' ? 20 : 2.2; // 2.2 = سماكة قلم حبر جاف (Ballpoint) رفيعة وطبيعية
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = mode === 'eraser' ? '#ffffff' : penColor;
                ctx.globalCompositeOperation = mode === 'eraser' ? 'destination-out' : 'source-over';
                ctx.lineTo(x, y);
                ctx.stroke();
            };

            const endDraw = () => {
                if (drawingRef.current) scheduleAutoSave();
                drawingRef.current = false;
            };

            const handleUndo = () => {
                if (undoStackRef.current.length === 0) return;
                playHardClick();
                const canvas = canvasRef.current;
                if (!canvas) return;
                const prevDataUrl = undoStackRef.current.pop();
                setCanUndo(undoStackRef.current.length > 0);
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const img = new Image();
                img.onload = () => { if (canvasRef.current) { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); scheduleAutoSave(); } };
                img.src = prevDataUrl;
            };

            const toolbar = (
                <div class={`flex gap-2 ${toolbarPosition === 'side' ? 'flex-col items-center' : 'items-center flex-wrap'}`}>
                    <button type="button" onClick={() => { setMode('pen'); setShowColors(false); }} class={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-[11px] font-bold ${mode === 'pen' ? 'bg-primary-500 text-white' : 'bg-slate-100 dark:bg-slate-700 dark:text-slate-200 text-slate-600'}`}>
                        <i data-lucide="pen" class="w-3.5 h-3.5"></i> {toolbarPosition === 'top' && 'قلم حبر جاف'}
                    </button>
                    <div class="relative">
                        <button type="button" onClick={() => setShowColors(v => !v)} title="لون القلم" class="w-7 h-7 rounded-full border-2 border-white shadow" style={{ backgroundColor: penColor }}></button>
                        {showColors && (
                            <div class={`absolute z-10 bg-white dark:bg-slate-800 border dark:border-slate-600 rounded-xl p-2 flex gap-1.5 shadow-lg ${toolbarPosition === 'side' ? 'top-0 right-9 flex-col' : 'top-9 right-0'}`}>
                                {PEN_COLORS.map(c => (
                                    <button key={c} type="button" onClick={() => { setPenColor(c); setMode('pen'); setShowColors(false); }} class="w-6 h-6 rounded-full border-2 border-white shadow" style={{ backgroundColor: c }}></button>
                                ))}
                            </div>
                        )}
                    </div>
                    <button type="button" onClick={() => setMode('eraser')} class={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-[11px] font-bold ${mode === 'eraser' ? 'bg-primary-500 text-white' : 'bg-slate-100 dark:bg-slate-700 dark:text-slate-200 text-slate-600'}`}>
                        <i data-lucide="eraser" class="w-3.5 h-3.5"></i> {toolbarPosition === 'top' && 'ممسحة'}
                    </button>
                    <button type="button" onClick={handleUndo} disabled={!canUndo} class={`flex items-center gap-1 px-3 py-1.5 rounded-lg text-[11px] font-bold ${canUndo ? 'bg-slate-100 dark:bg-slate-700 dark:text-slate-200 text-slate-600' : 'bg-slate-50 dark:bg-slate-800 text-slate-300 dark:text-slate-600 cursor-not-allowed'}`}>
                        <i data-lucide="undo-2" class="w-3.5 h-3.5"></i> {toolbarPosition === 'top' && 'تراجع خطوة'}
                    </button>
                    {toolbarPosition === 'top' && (
                        <span class="mr-auto text-[10px] text-slate-400 flex items-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> يُحفظ تلقائياً</span>
                    )}
                </div>
            );

            const canvasEl = (
                <canvas
                    ref={canvasRef}
                    width={600}
                    height={height}
                    class="draw-canvas-pen w-full block bg-transparent select-none"
                    onPointerDown={startDraw} onPointerMove={draw} onPointerUp={endDraw} onPointerCancel={endDraw} onPointerLeave={endDraw}
                ></canvas>
            );

            if (toolbarPosition === 'side') {
                return (
                    <div class="space-y-2">
                        <div class="flex gap-3 items-start">
                            <div ref={wrapperRef} class="notebook-paper flex-1 rounded-xl border border-slate-200 overflow-y-auto thin-scroll select-none" style={{ maxHeight: maxViewHeight + 'px', WebkitUserSelect: 'none', WebkitTouchCallout: 'none' }}>
                                {canvasEl}
                            </div>
                            <div class="shrink-0 bg-slate-50 dark:bg-slate-800 p-2 rounded-xl">{toolbar}</div>
                        </div>
                        <p class="text-[10px] text-slate-400 text-center flex items-center justify-center gap-1"><i data-lucide="check" class="w-3 h-3"></i> يُحفظ تلقائياً · مرّر بإصبعك للأسفل داخل الورقة لمساحة أكبر</p>
                    </div>
                );
            }

            return (
                <div class="space-y-2">
                    {toolbar}
                    <div ref={wrapperRef} class="notebook-paper w-full rounded-xl border border-slate-200 overflow-y-auto thin-scroll select-none" style={{ maxHeight: maxViewHeight + 'px', WebkitUserSelect: 'none', WebkitTouchCallout: 'none' }}>
                        {canvasEl}
                    </div>
                    <p class="text-[10px] text-slate-400 text-center">مرّر بإصبعك للأسفل داخل الورقة للحصول على مساحة كتابة أكبر</p>
                </div>
            );
        }

        // بطاقة عرض ملف واحد بنمط "Document Card"
        function DocumentCard({ file, onOpen, onDelete, onFinish, allowFinish }) {
            const kindMeta = {
                text: { icon: 'file-text', label: 'نص', color: 'text-blue-500 bg-blue-50' },
                image: { icon: 'image', label: 'صورة', color: 'text-purple-500 bg-purple-50' },
                pdf: { icon: 'file-type', label: 'PDF', color: 'text-red-500 bg-red-50' },
                other: { icon: 'file', label: 'ملف', color: 'text-amber-500 bg-amber-50' },
            }[file.kind] || { icon: 'file', label: 'ملف', color: 'text-slate-500 bg-slate-50' };

            return (
                <div class="bg-white border border-slate-100 dark:bg-slate-800 dark:border-slate-700 rounded-2xl overflow-hidden flex flex-col hover:shadow-md transition-all">
                    <div onClick={() => onOpen(file)} class="cursor-pointer">
                        {file.kind === 'image' ? (
                            <div class="h-28 w-full bg-slate-100 dark:bg-slate-700 overflow-hidden">
                                <img src={file.content} class="w-full h-full object-cover" />
                            </div>
                        ) : file.kind === 'pdf' && file.thumbnail ? (
                            <div class="h-28 w-full bg-slate-100 dark:bg-slate-700 overflow-hidden flex items-start justify-center">
                                <img src={file.thumbnail} class="w-full h-full object-cover object-top" />
                            </div>
                        ) : file.kind === 'text' ? (
                            <div class="h-28 w-full p-3 bg-blue-50/50 dark:bg-slate-700/40 overflow-hidden">
                                <p class="text-[10px] leading-relaxed text-slate-500 dark:text-slate-300 line-clamp-5 whitespace-pre-wrap">{file.content}</p>
                            </div>
                        ) : (
                            <div class={`h-28 w-full flex items-center justify-center ${kindMeta.color} dark:bg-slate-700/40`}>
                                <i data-lucide={kindMeta.icon} class="w-9 h-9"></i>
                            </div>
                        )}
                        <div class="p-3">
                            <h4 class="font-bold text-sm truncate">{file.name}</h4>
                            <div class="flex items-center gap-1.5 mt-1">
                                <span class={`text-[10px] px-2 py-0.5 rounded-full font-bold ${kindMeta.color}`}>{kindMeta.label}</span>
                                {file.annotation && <span class="text-[10px] text-emerald-500 font-bold">✎ ملاحظات محفوظة</span>}
                            </div>
                        </div>
                    </div>
                    <div class="mt-auto flex items-center justify-between gap-2 px-3 pb-3">
                        <button onClick={() => onOpen(file)} class="flex-1 bg-primary-500 text-white text-[11px] px-2 py-1.5 rounded-lg font-bold">فتح وتصفح</button>
                        {allowFinish && (
                            <button onClick={() => onFinish(file)} title="تم الإكمال" class="text-slate-400 hover:text-emerald-500 shrink-0">
                                <i data-lucide="check-circle" class="w-4 h-4"></i>
                            </button>
                        )}
                        <button onClick={() => onDelete(file)} title="حذف" class="text-slate-300 hover:text-red-500 shrink-0">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            );
        }

        // صفحة فرعية موحّدة لوحدات القراءة (تُستخدم لكل من "جديد" و "تم القراءة")
        function ReadingUnitsPage({ title, units, setUnits, onAddStats, onBack, allowFinish }) {
            const [selectedUnitId, setSelectedUnitId] = useState(null);
            const [isAddingUnit, setIsAddingUnit] = useState(false);
            const [isAddingFile, setIsAddingFile] = useState(false);
            const [viewingFileId, setViewingFileId] = useState(null);
            const [isEditingText, setIsEditingText] = useState(false);
            const [editDraft, setEditDraft] = useState('');

            const [unitName, setUnitName] = useState('');
            const [fileName, setFileName] = useState('');
            const [fileMode, setFileMode] = useState('upload'); // 'upload' (ملف حقيقي) | 'type' (نص مكتوب يدوياً)
            const [fileTextContent, setFileTextContent] = useState('');
            const [pickedFile, setPickedFile] = useState(null); // { kind, content, mime }
            const [filePickStatus, setFilePickStatus] = useState('idle'); // idle | loading | ready | error
            const fileInputRef = useRef(null);

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [selectedUnitId, viewingFileId, isAddingUnit, isAddingFile, isEditingText, filePickStatus]);
            useEffect(() => { setIsEditingText(false); }, [viewingFileId]);

            // نشتق البيانات الحيّة دائماً من قائمة units بدل الاحتفاظ بنسخة قديمة منفصلة،
            // هذا يضمن أن أي ملف جديد أو تعديل يظهر فوراً دون الحاجة لإعادة فتح الصفحة
            const selectedUnit = units.find(u => u.id === selectedUnitId) || null;
            const viewingFile = selectedUnit ? (selectedUnit.files.find(f => f.id === viewingFileId) || null) : null;

            const resetFilePicker = () => {
                setFileName(''); setFileTextContent(''); setPickedFile(null); setFileMode('upload');
                setFilePickStatus('idle');
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const handleCreateUnit = () => {
                if (!unitName.trim()) return;
                const newUnit = { id: Date.now().toString(), name: unitName, files: [] };
                setUnits([...units, newUnit]);
                setUnitName('');
                setIsAddingUnit(false);
            };

            // رفع أي ملف حقيقي (صورة، PDF، أو نص) والتعرف عليه تلقائياً
            const handleFilePick = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!fileName.trim()) setFileName(file.name);
                setFilePickStatus('loading');
                setPickedFile(null);

                if (file.size > 4 * 1024 * 1024) {
                    alert('تنبيه: هذا الملف كبير الحجم (أكبر من 4MB) وقد لا يتم حفظه محلياً بسبب محدودية مساحة المتصفح. يفضّل استخدام ملفات أصغر أو خيار "كتابة نص يدوياً".');
                }

                const mime = file.type || '';
                const isImage = mime.startsWith('image/');
                const isPdf = mime === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
                const isText = mime.startsWith('text/') || file.name.toLowerCase().match(/\.(txt|md)$/);

                const reader = new FileReader();
                reader.onerror = () => {
                    setFilePickStatus('error');
                    alert('تعذر قراءة هذا الملف. حاول مرة أخرى بملف آخر.');
                };
                if (isText) {
                    reader.onload = () => { setPickedFile({ kind: 'text', content: reader.result, mime }); setFilePickStatus('ready'); };
                    reader.readAsText(file);
                } else if (isImage) {
                    reader.onload = async () => {
                        const dataUrl = reader.result;
                        const compressed = await compressImageDataUrl(dataUrl);
                        setPickedFile({ kind: 'image', content: compressed, mime });
                        setFilePickStatus('ready');
                    };
                    reader.readAsDataURL(file);
                } else if (isPdf) {
                    reader.onload = async () => {
                        const dataUrl = reader.result;
                        const [thumb, extractedText] = await Promise.all([
                            generatePdfThumbnail(dataUrl),
                            extractPdfText(dataUrl)
                        ]);
                        setPickedFile({ kind: 'pdf', content: dataUrl, mime, thumbnail: thumb, extractedText });
                        setFilePickStatus('ready');
                    };
                    reader.readAsDataURL(file);
                } else {
                    // نوع آخر (Word، إلخ): نحفظه كملف قابل للتنزيل مع تنبيه أنه لا يمكن معاينته مباشرة
                    reader.onload = () => { setPickedFile({ kind: 'other', content: reader.result, mime }); setFilePickStatus('ready'); };
                    reader.readAsDataURL(file);
                }
            };

            const handleCreateFile = () => {
                if (!fileName.trim() || !selectedUnit) return;
                if (fileMode === 'upload' && (filePickStatus !== 'ready' || !pickedFile)) {
                    alert('انتظر حتى ينتهي تحميل الملف (أو اختر ملفاً أولاً) قبل الحفظ.');
                    return;
                }
                if (fileMode === 'type' && !fileTextContent.trim()) return;

                const newFile = fileMode === 'upload'
                    ? { id: Date.now().toString(), name: fileName, kind: pickedFile.kind, content: pickedFile.content, thumbnail: pickedFile.thumbnail || null, extractedText: pickedFile.extractedText || null, annotation: null }
                    : { id: Date.now().toString(), name: fileName, kind: 'text', content: fileTextContent, thumbnail: null, extractedText: null, annotation: null };

                setUnits(prev => prev.map(u => u.id === selectedUnit.id ? { ...u, files: [...u.files, newFile] } : u));

                resetFilePicker();
                setIsAddingFile(false);
            };

            const handleSaveAnnotation = (unitId, fileId, dataUrl) => {
                setUnits(prev => prev.map(u => {
                    if (u.id !== unitId) return u;
                    return { ...u, files: u.files.map(f => f.id === fileId ? { ...f, annotation: dataUrl } : f) };
                }));
                alert('تم حفظ تعديلاتك على الملف بنجاح.');
            };

            // حفظ التعديل على محتوى النص نفسه (كتابة/حذف داخل الملف) - يدعم ملفات النص وملفات PDF (كنص مستخرج)
            const handleSaveTextEdit = () => {
                const field = viewingFile.kind === 'text' ? 'content' : 'extractedText';
                setUnits(prev => prev.map(u => {
                    if (u.id !== selectedUnit.id) return u;
                    return { ...u, files: u.files.map(f => f.id === viewingFile.id ? { ...f, [field]: editDraft } : f) };
                }));
                playHardClick();
                setIsEditingText(false);
                alert('تم حفظ التعديلات على نص الملف بنجاح.');
            };

            const handleFinishReading = (unitId, fileId, fileNameVal) => {
                playCompleteSound();
                onAddStats(15); // إضافة 15 دقيقة قراءة تلقائياً
                alert(`أحسنت! تم تسجيل إكمال قراءة الملف "${fileNameVal}".`);
            };

            const handleDeleteUnit = (unitId) => {
                if (!confirm('حذف هذه الوحدة وجميع ملفاتها؟')) return;
                playHardClick();
                setUnits(units.filter(u => u.id !== unitId));
                if (selectedUnitId === unitId) setSelectedUnitId(null);
            };

            const handleDeleteFile = (unitId, fileId) => {
                if (!confirm('هل تريد حذف هذا الملف؟')) return;
                playHardClick();
                setUnits(prev => prev.map(u => u.id === unitId ? { ...u, files: u.files.filter(f => f.id !== fileId) } : u));
                setViewingFileId(null);
                setIsEditingText(false);
            };

            // ترجمة النص المحدد (Selection) عبر جوجل ترانسليت في نافذة جديدة
            const handleTranslateSelection = () => {
                const selected = window.getSelection ? window.getSelection().toString().trim() : '';
                if (!selected) {
                    alert('حدد (لوّن) أي جزء من النص أولاً، ثم اضغط زر الترجمة.');
                    return;
                }
                const url = `https://translate.google.com/?sl=auto&tl=ar&text=${encodeURIComponent(selected)}&op=translate`;
                window.open(url, '_blank');
            };

            // ===================== شاشة عرض ملفات وحدة واحدة (Document Card UI) =====================
            if (selectedUnit && !viewingFile) {
                return (
                    <div class="space-y-6">
                        <div class="flex items-center justify-between">
                            <BackButton onClick={() => setSelectedUnitId(null)} label="رجوع للوحدات" />
                            <h2 class="text-lg font-black truncate">{selectedUnit.name}</h2>
                            <button onClick={() => { resetFilePicker(); setIsAddingFile(true); }} class="bg-primary-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold shrink-0">+ أضف ملف</button>
                        </div>

                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                            {selectedUnit.files.map(file => (
                                <DocumentCard
                                    key={file.id}
                                    file={file}
                                    allowFinish={allowFinish}
                                    onOpen={(f) => { setViewingFileId(f.id); setIsEditingText(false); }}
                                    onDelete={(f) => handleDeleteFile(selectedUnit.id, f.id)}
                                    onFinish={(f) => handleFinishReading(selectedUnit.id, f.id, f.name)}
                                />
                            ))}
                        </div>
                        {selectedUnit.files.length === 0 && (
                            <p class="text-xs text-slate-400 text-center py-10">لا توجد ملفات في هذه الوحدة بعد. اضغط "+ أضف ملف" لإدراج أول ملف.</p>
                        )}

                        {/* Add File popup - رفع ملف حقيقي (صورة / PDF / نص) أو كتابة نص يدوياً */}
                        {isAddingFile && (
                            <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                                <div class="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                    <div class="flex justify-between items-center">
                                        <h3 class="text-lg font-bold">إدراج ملف للوحدة: {selectedUnit.name}</h3>
                                        <BackButton onClick={() => { setIsAddingFile(false); resetFilePicker(); }} label="إغلاق" />
                                    </div>
                                    <input type="text" placeholder="اسم المقال أو الكتاب..." value={fileName} onChange={(e) => setFileName(e.target.value)} class="w-full border p-3 rounded-xl text-sm" />

                                    <div class="flex gap-2">
                                        <button onClick={() => setFileMode('upload')} class={`flex-1 py-2 rounded-lg text-xs font-bold ${fileMode === 'upload' ? 'bg-primary-500 text-white' : 'bg-slate-100 text-slate-600'}`}>رفع ملف حقيقي</button>
                                        <button onClick={() => setFileMode('type')} class={`flex-1 py-2 rounded-lg text-xs font-bold ${fileMode === 'type' ? 'bg-primary-500 text-white' : 'bg-slate-100 text-slate-600'}`}>كتابة نص يدوياً</button>
                                    </div>

                                    {fileMode === 'upload' ? (
                                        <div class="space-y-2">
                                            <input type="file" accept="image/*,.pdf,.txt,.md,.doc,.docx" ref={fileInputRef} onChange={handleFilePick} class="w-full text-xs" />
                                            {filePickStatus === 'loading' && <span class="text-[11px] text-slate-500 font-bold block">⏳ جارٍ تحميل الملف، الرجاء الانتظار...</span>}
                                            {filePickStatus === 'error' && <span class="text-[11px] text-red-600 font-bold block">✗ تعذر تحميل الملف، جرّب ملفاً آخر.</span>}
                                            {pickedFile && pickedFile.kind === 'image' && <img src={pickedFile.content} class="h-24 rounded-lg border" />}
                                            {pickedFile && pickedFile.kind === 'pdf' && <span class="text-[11px] text-emerald-600 font-bold block">✓ تم اختيار ملف PDF بنجاح، سيتم عرضه داخل التطبيق.</span>}
                                            {pickedFile && pickedFile.kind === 'text' && <span class="text-[11px] text-emerald-600 font-bold block">✓ تم تحميل نص الملف بنجاح.</span>}
                                            {pickedFile && pickedFile.kind === 'other' && <span class="text-[11px] text-amber-600 font-bold block">⚠ هذا النوع لا يمكن معاينته داخل المتصفح مباشرة، لكن سيتم حفظه ويمكنك تنزيله لاحقاً.</span>}
                                        </div>
                                    ) : (
                                        <textarea value={fileTextContent} onChange={(e) => setFileTextContent(e.target.value)} placeholder="الصق أو اكتب نص المقال هنا..." class="w-full h-32 border p-3 rounded-xl text-sm" />
                                    )}

                                    <div class="flex justify-end gap-2">
                                        <button onClick={() => { setIsAddingFile(false); resetFilePicker(); }} class="px-4 py-2 text-slate-500">إلغاء</button>
                                        <button
                                            onClick={handleCreateFile}
                                            disabled={fileMode === 'upload' && filePickStatus === 'loading'}
                                            class={`px-5 py-2 rounded-xl font-bold text-white ${fileMode === 'upload' && filePickStatus === 'loading' ? 'bg-slate-300 cursor-not-allowed' : 'bg-primary-500'}`}
                                        >
                                            {fileMode === 'upload' && filePickStatus === 'loading' ? 'جارٍ التحميل...' : 'حفظ'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            // ===================== شاشة تصفح ملف واحد + تحرير/ترجمة/حذف/حفظ =====================
            if (selectedUnit && viewingFile) {
                return (
                    <div class="fixed inset-0 bg-white dark:bg-slate-900 z-50 flex flex-col h-screen">
                        <header class="p-4 border-b dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800 gap-2">
                            <BackButton onClick={() => { setViewingFileId(null); setIsEditingText(false); }} label="رجوع لقائمة الملفات" />
                            <h3 class="font-bold text-slate-800 dark:text-slate-100 truncate">{viewingFile.name}</h3>

                            {viewingFile.kind === 'text' && isEditingText && (

                                    {!isEditingText && (

                                                <p class="text-xs text-slate-500">اضغط "تعديل النص" أدناه لكتابة أو نسخ النص يدوياً، وسيُحفظ ويصبح قابلاً للترجمة مستقبلاً.</p>

                                <div class="text-center p-6 bg-slate-50 rounded-xl space-y-3">
                                    <p class="text-sm text-slate-500">هذا النوع من الملفات لا يمكن معاينته مباشرة داخل المتصفح.</p>
                                    <a href={viewingFile.content} download={viewingFile.name} class="inline-block bg-primary-500 text-white text-xs px-4 py-2 rounded-lg font-bold">تنزيل الملف</a>

                            {(viewingFile.kind === 'text' || viewingFile.kind === 'pdf' || viewingFile.kind === 'image') && (

                                <AnnotationCanvas

                                    onSave={(dataUrl) => handleSaveAnnotation(selectedUnit.id, viewingFile.id, dataUrl)}

            }

            // ===================== شاشة قائمة الوحدات =====================
            return (
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <BackButton onClick={onBack} />
                        <h2 class="text-xl font-black">{title}</h2>
                        <button onClick={() => setIsAddingUnit(true)} class="bg-primary-500 text-white text-xs px-3 py-1.5 rounded-xl font-bold">+ إضافة Unit</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {units.map(unit => (

                                    <h4 class="font-bold">{unit.name}</h4>

                                </div>
                                <div class="flex gap-2 items-center">
                                    <button onClick={() => { setSelectedUnitId(unit.id); resetFilePicker(); setIsAddingFile(true); }} class="bg-slate-100 dark:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs px-3 py-1.5 rounded-lg">
                                        + أضف ملف

                                        عرض

                        {units.length === 0 && <p class="text-xs text-slate-400 col-span-2 text-center py-6">لا توجد وحدات بعد. أضف أول Unit للبدء.</p>}
                    </div>

                    {/* Add Unit popup */}
                    {isAddingUnit && (
                        <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                            <div class="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-lg font-bold">إضافة Unit جديد</h3>
                                    <BackButton onClick={() => setIsAddingUnit(false)} label="إغلاق" />
                                </div>
                                <input type="text" placeholder="اسم الـ Unit..." value={unitName} onChange={(e) => setUnitName(e.target.value)} class="w-full border p-3 rounded-xl text-sm" />
                                <div class="flex justify-end gap-2">
                                    <button onClick={() => setIsAddingUnit(false)} class="px-4 py-2 text-slate-500">إلغاء</button>
                                    <button onClick={handleCreateUnit} class="bg-primary-500 text-white px-5 py-2 rounded-xl font-bold">إنشاء</button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }
        // ==========================================
        // 9. READING SCREEN
        // ==========================================
        function ReadingScreen({ sources, setSources, unitsNew, setUnitsNew, unitsRead, setUnitsRead, onAddStats, onBack }) {
            const [isAddingSource, setIsAddingSource] = useState(null);
            const [section, setSection] = useState(null); // null | 'new' | 'read'

            const [sourceName, setSourceName] = useState('');
            const [sourceUrl, setSourceUrl] = useState('');
            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [isAddingSource, section]);

            const handleSaveSource = () => {
                if (!sourceName.trim() || isAddingSource === null) return;
                const nextSources = [...sources];
                nextSources[isAddingSource] = { name: sourceName, url: sourceUrl };
                setSources(nextSources);
                setSourceName('');
                setSourceUrl('');
                setIsAddingSource(null);
            };

            if (section === 'new') {
                return <ReadingUnitsPage title="جديد" units={unitsNew} setUnits={setUnitsNew} onAddStats={onAddStats} onBack={() => setSection(null)} allowFinish={true} />;
            }
            if (section === 'read') {
                return <ReadingUnitsPage title="تم القراءة" units={unitsRead} setUnits={setUnitsRead} onAddStats={onAddStats} onBack={() => setSection(null)} allowFinish={false} />;
            }

            return (
                <div class="space-y-8">
                    <div class="flex items-center justify-between">
                        <BackButton onClick={onBack} />
                    </div>
                    <div>
                        <h2 class="text-2xl font-black">مصادر وقراءاتي اللغوية</h2>
                        <p class="text-sm text-slate-400">إدارة القراءة الذاتية وحفظ آخر تقدم</p>
                    </div>

                    {/* Sources top bar */}
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        {sources.map((src, i) => (
                            <div key={i} onClick={() => setIsAddingSource(i)} class="p-4 rounded-2xl border border-dashed border-slate-200 hover:border-primary-500 cursor-pointer text-center bg-slate-50/50 flex flex-col items-center justify-center min-h-[90px] transition-all">
                                {src ? (
                                    <>
                                        <h5 class="font-bold text-xs">{src.name}</h5>
                                        <a href={src.url} target="_blank" rel="noopener noreferrer" onClick={(e) => e.stopPropagation()} class="text-[10px] text-primary-500 underline mt-1 block overflow-hidden max-w-full text-ellipsis">{src.url}</a>
                                    </>
                                ) : (
                                    <span class="text-xs text-slate-400">+ أضف مصدر {i + 1}</span>
                                )}
                            </div>
                        ))}
                    </div>

                    {/* جديد / تم القراءة - نافذتان منفصلتان */}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div onClick={() => setSection('new')} class="cursor-pointer bg-primary-50 dark:bg-primary-950/20 border-2 border-primary-200 dark:border-primary-800 p-6 rounded-2xl flex items-center justify-between hover:shadow-md transition-all">
                            <div>
                                <h3 class="font-bold text-lg text-primary-700 dark:text-primary-400">جديد</h3>
                                <p class="text-xs text-slate-400 mt-1">{unitsNew.length} وحدات قيد القراءة</p>
                            </div>
                            <i data-lucide="chevron-left" class="w-6 h-6 text-primary-400"></i>
                        </div>
                        <div onClick={() => setSection('read')} class="cursor-pointer bg-emerald-50 dark:bg-emerald-950/20 border-2 border-emerald-200 dark:border-emerald-800 p-6 rounded-2xl flex items-center justify-between hover:shadow-md transition-all">
                            <div>
                                <h3 class="font-bold text-lg text-emerald-700 dark:text-emerald-400">تم القراءة</h3>
                                <p class="text-xs text-slate-400 mt-1">{unitsRead.length} وحدات مكتملة</p>
                            </div>
                            <i data-lucide="chevron-left" class="w-6 h-6 text-emerald-400"></i>
                        </div>
                    </div>

                    {/* Add Source popup */}
                    {isAddingSource !== null && (
                        <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                            <div class="bg-white w-full max-w-md rounded-3xl p-6 space-y-4">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-lg font-bold">تحديد المصدر المرجعي</h3>
                                    <BackButton onClick={() => setIsAddingSource(null)} label="إغلاق" />
                                </div>
                                <input type="text" placeholder="اسم المصدر (مثلا: BBC)..." value={sourceName} onChange={(e) => setSourceName(e.target.value)} class="w-full border p-3 rounded-xl text-sm" />
                                <input type="text" placeholder="الرابط المباشر..." value={sourceUrl} onChange={(e) => setSourceUrl(e.target.value)} class="w-full border p-3 rounded-xl text-sm" />
                                <div class="flex justify-end gap-2">
                                    <button onClick={() => setIsAddingSource(null)} class="px-4 py-2 text-slate-500">إلغاء</button>
                                    <button onClick={handleSaveSource} class="bg-primary-500 text-white px-5 py-2 rounded-xl font-bold">حفظ</button>

                        </div>
                    )}
                </div>
            );

        // ==========================================
        // 10. WRITING SCREEN
        // ==========================================
        function WritingScreen({ topics, setWritingTopics, suggestions, setSuggestions, onAddStats, onBack }) {
            const [isAddingTopic, setIsAddingTopic] = useState(false);
            const [topicTitle, setTopicTitle] = useState('');
            const [newSuggestionText, setNewSuggestionText] = useState('');
            const [suggestionIndex, setSuggestionIndex] = useState(0);

            const [activeWriteTopic, setActiveWriteTopic] = useState(null);

            // مؤقّت يدوي واحد فقط (بدل أزرار المدد الأربعة القديمة)
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerRunning, setTimerRunning] = useState(false);
            const timerIntervalRef = useRef(null);

            // إضافة كلمة جديدة يدوياً لقسم "الكلمات الجديدة" في الموضوع
            const [newWordInput, setNewWordInput] = useState('');

            useEffect(() => { if (window.lucide) window.lucide.createIcons(); }, [isAddingTopic, activeWriteTopic, suggestions.length, timerRunning]);

            useEffect(() => {
                if (timerRunning) {
                    timerIntervalRef.current = setInterval(() => setTimerSeconds(s => s + 1), 1000);
                } else if (timerIntervalRef.current) {
                    clearInterval(timerIntervalRef.current);
                }
                return () => { if (timerIntervalRef.current) clearInterval(timerIntervalRef.current); };
            }, [timerRunning]);

            const formatTimer = (totalSeconds) => {
                const m = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
                const s = (totalSeconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const toggleTimer = () => {
                playSoftClick();
                if (timerRunning) {
                    // عند الإيقاف، نضيف الدقائق المنقضية فعلياً إلى الإحصائيات
                    const minutesSpent = Math.round(timerSeconds / 60);
                    if (minutesSpent > 0) onAddStats(minutesSpent);
                }
                setTimerRunning(r => !r);
            };

            const handleCreateTopic = (titleToUse = null) => {
                const finalTitle = titleToUse || topicTitle;
                if (!finalTitle.trim()) return;

                const newTopic = {
                    id: Date.now().toString(),
                    title: finalTitle,
                    duration: 10,
                    completed: false,
                    text: '',
                    essayDrawing: null,
                    newWordsDrawing: null,
                    pickedWords: []
                };

                setWritingTopics([...topics, newTopic]);
                setTopicTitle('');
                setIsAddingTopic(false);
            };

            const handleAddSuggestion = () => {
                if (!newSuggestionText.trim()) return;
                setSuggestions([...suggestions, { id: Date.now().toString(), text: newSuggestionText }]);
                setNewSuggestionText('');
            };

            const handleDeleteSuggestion = () => {
                if (suggestions.length === 0) return;
                if (!confirm('حذف هذا الاقتراح؟')) return;
                playHardClick();
                const idToDelete = suggestions[suggestionIndex].id;
                setSuggestions(prev => prev.filter(s => s.id !== idToDelete));
                setSuggestionIndex(0);
            };

            const handleDeleteTopic = (topicId) => {
                if (!confirm('حذف هذا الموضوع؟ سيُحذف كل ما كتبته فيه.')) return;
                playHardClick();
                setWritingTopics(prev => prev.filter(t => t.id !== topicId));
                if (activeWriteTopic && activeWriteTopic.id === topicId) {
                    setActiveWriteTopic(null);
                }
            };

            const handleAcceptSuggestion = () => {
                if (suggestions.length === 0) return;
                playHardClick();
                const chosenText = suggestions[suggestionIndex].text;
                const newTopic = { id: Date.now().toString(), title: chosenText, duration: 10, completed: false, text: '', essayDrawing: null, newWordsDrawing: null, pickedWords: [] };
                setWritingTopics(prev => [...prev, newTopic]);
                setIsAddingTopic(false);
                // فتح الموضوع الجديد فوراً حتى يرى المستخدم إضافته مباشرة
                openTopic(newTopic);
            };

            const openTopic = (topic) => {
                setActiveWriteTopic(topic);
                setTimerSeconds(0);
                setTimerRunning(false);
            };

            const closeEditor = () => {
                setActiveWriteTopic(null);
                setTimerRunning(false);
            };

            // حفظ صامت وفوري (بدون أي زر) لكل تعديل يحصل أثناء الكتابة بالقلم
            const persistTopicField = (field, value) => {
                if (!activeWriteTopic) return;
                setWritingTopics(prev => prev.map(t => t.id === activeWriteTopic.id ? { ...t, [field]: value } : t));
            };

            const handleAddPickedWord = () => {
                const word = newWordInput.trim();
                if (!activeWriteTopic || !word) return;
                const current = activeWriteTopic.pickedWords || [];
                if (current.includes(word)) { setNewWordInput(''); return; }
                const updated = [...current, word];
                setActiveWriteTopic(t => ({ ...t, pickedWords: updated }));
                persistTopicField('pickedWords', updated);
                playSoftClick();
                setNewWordInput('');
            };

            const handleRemovePickedWord = (word) => {
                if (!activeWriteTopic) return;
                const updated = (activeWriteTopic.pickedWords || []).filter(w => w !== word);
                setActiveWriteTopic(t => ({ ...t, pickedWords: updated }));
                persistTopicField('pickedWords', updated);
            };

            return (
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <BackButton onClick={onBack} />
                    </div>
                    <div class="flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-black">ممارسة الكتابة (Writing)</h2>
                            <p class="text-sm text-slate-400 mt-1">اكتب بخط يدك مباشرة على الورقة، وسيُحفظ كل شيء تلقائياً</p>
                        </div>
                        <button onClick={() => setIsAddingTopic(true)} class="bg-primary-500 text-white px-4 py-2 rounded-xl text-xs font-bold">
                            + إضافة موضوع
                        </button>
                    </div>

                    {/* Topics Grid Cards */}
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        {topics.map(topic => (
                            <div key={topic.id} class="bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 p-5 rounded-2xl flex justify-between items-center gap-2">
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-slate-800 dark:text-slate-100 truncate">{topic.title}</h4>
                                    <p class="text-xs text-slate-400 mt-1">{topic.essayDrawing ? 'يوجد كتابة محفوظة' : 'لم يُكتب فيه بعد'}</p>
                                </div>
                                <button onClick={() => openTopic(topic)} class="bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-slate-200 text-slate-700 text-xs px-4 py-2 rounded-xl font-bold shrink-0">
                                    كتابة الآن
                                </button>
                                <button onClick={() => handleDeleteTopic(topic.id)} title="حذف الموضوع" class="text-slate-300 hover:text-red-500 shrink-0">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </div>
                        ))}
                    </div>

                    {/* Create topic modal popup - بنك اقتراحات المستخدم مع تصفح أمام/خلف (فقط، بدون حقل عنوان منفصل) */}
                    {isAddingTopic && (
                        <div class="fixed inset-0 bg-slate-900/60 z-50 flex items-center justify-center p-4">
                            <div class="bg-white dark:bg-slate-800 w-full max-w-md rounded-3xl p-6 space-y-4">
                                <div class="flex justify-between items-center">
                                    <h3 class="text-lg font-bold">إضافة موضوع كتابة جديد</h3>
                                    <BackButton onClick={() => setIsAddingTopic(false)} label="إغلاق" />
                                </div>

                                <div class="space-y-2 p-3 bg-slate-50 dark:bg-slate-900 rounded-xl">

                                                </div>

                                                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                                                </button>
                                                <button onClick={handleDeleteSuggestion} title="حذف هذا الاقتراح" class="p-2 bg-red-50 text-red-500 border border-red-100 rounded-full">
                                                    <i data-lucide="trash-2" class="w-4 h-4"></i>

                                                <i data-lucide="check-circle" class="w-4 h-4"></i> استخدم هذا كموضوع كتابتي الآن
                                            </button>
                                        </div>
                                    ) : (
                                        <p class="text-[11px] text-slate-400 text-center py-2">لا توجد اقتراحات محفوظة بعد، أضف أول اقتراح لك أعلاه.</p>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* شاشة الكتابة بخط اليد (بالقلم فقط) - عرض كامل الشاشة */}
                    {activeWriteTopic && (
                        <div class="fixed inset-0 bg-white dark:bg-slate-900 z-50 flex flex-col h-screen select-none" style={{ WebkitUserSelect: 'none', WebkitTouchCallout: 'none' }}>
                            <header class="p-4 border-b dark:border-slate-700 flex justify-between items-center bg-slate-50 dark:bg-slate-800 gap-2">
                                <BackButton onClick={closeEditor} label="خروج" />
                                <div class="text-center min-w-0">

                                    <h3 class="font-bold text-slate-800 dark:text-slate-100 truncate">{activeWriteTopic.title}</h3>
                                </div>
                                <button onClick={() => handleDeleteTopic(activeWriteTopic.id)} class="text-slate-400 hover:text-red-500 flex items-center gap-1 text-xs font-bold shrink-0">
                                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                                </button>
                            </header>

                            <div class="flex-1 overflow-y-auto p-4 md:p-6 max-w-3xl w-full mx-auto space-y-6">

                                {/* قسم الكلمات الجديدة */}
                                <div class="bg-green-50/50 dark:bg-green-950/10 border border-green-100 dark:border-green-900/40 rounded-2xl p-4 space-y-3">
                                    <div class="flex items-center justify-between gap-2 flex-wrap">
                                        <h4 class="text-xs font-bold text-slate-600 dark:text-slate-300">the new words that I want to use it :</h4>
                                        <div class="flex items-center gap-2">
                                            <input
                                                type="text"
                                                value={newWordInput}
                                                onChange={(e) => setNewWordInput(e.target.value)}
                                                onKeyDown={(e) => { if (e.key === 'Enter') handleAddPickedWord(); }}
                                                placeholder="أضف كلمة جديدة..."
                                                class="border border-green-200 dark:border-green-900 dark:bg-slate-800 p-2 rounded-lg text-xs w-32 md:w-44"
                                            />
                                            <button onClick={handleAddPickedWord} class="flex items-center gap-1 bg-white dark:bg-slate-800 border border-green-200 dark:border-green-900 text-green-700 dark:text-green-400 px-2.5 py-2 rounded-lg text-[11px] font-bold">
                                                <i data-lucide="plus" class="w-3.5 h-3.5"></i> إضافة

                                    {(activeWriteTopic.pickedWords || []).length > 0 && (
